#amigos-prototipo {font-family:Montserrat,Arial,sans-serif;color:#123B2A;background:#F5F0E6;max-width:520px;margin:0 auto;padding:28px 18px 36px;box-sizing:border-box;min-height:650px;color-scheme:light;}
#amigos-prototipo * {box-sizing:border-box}
#amigos-prototipo button,#amigos-prototipo input {font:inherit}
#amigos-prototipo button {cursor:pointer;touch-action:manipulation}
#amigos-prototipo .am-logo {display:block;width:218px;max-width:75%;height:auto;margin:0 auto 28px}
#amigos-prototipo .am-nav {display:grid;grid-template-columns:1fr 1.55fr 1fr;gap:6px;align-items:stretch}
#amigos-prototipo .am-nav button {min-height:62px;border:1px solid #b5beae;border-radius:10px;background:transparent;color:#123B2A;font-size:14px;font-weight:700;padding:8px 4px}
#amigos-prototipo .am-nav .am-selected {background:#123B2A;color:#F5F0E6;border-color:#123B2A;font-size:16px}
#amigos-prototipo .am-selected small {display:block;font-size:11px;font-weight:500;margin-top:3px}
#amigos-prototipo .am-choose {display:block;min-height:48px;margin:7px auto 0;padding:8px 16px;border:0;background:transparent;color:#123B2A;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
#amigos-prototipo .am-demo {margin:6px 0 23px;text-align:center;color:#4B3222;font-size:11px;font-weight:500;line-height:1.6}
#amigos-prototipo .am-card {background:#fffdf8;border:1px solid #d4d8c9;border-radius:14px;margin:0 0 16px;padding:24px}
#amigos-prototipo h2 {font-size:27px;line-height:1.2;letter-spacing:.015em;font-weight:800;margin:0 0 19px;color:#123B2A;overflow-wrap:anywhere}
#amigos-prototipo .am-people {font-size:20px;line-height:1.4;font-weight:700;margin:0 0 5px}
#amigos-prototipo .am-name {font-size:17px;line-height:1.45;font-weight:400;color:#4B3222;margin:0 0 16px;overflow-wrap:anywhere}
#amigos-prototipo .am-status {display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:6px;font-size:13px;line-height:1.3;font-weight:700;letter-spacing:.035em;margin:0 0 14px}
#amigos-prototipo .am-arrival {color:#123B2A;background:#e6eddf;border-left:4px solid #4F6B3A}
#amigos-prototipo .am-stay {color:#123B2A;background:#efeee2;border-left:4px solid #7A7A4A}
#amigos-prototipo .am-departure {color:#4B3222;background:#f7e9ce;border-left:4px solid #D28C1F}
#amigos-prototipo .am-exit {font-size:15px;line-height:1.4;margin:0;color:#4B3222}
#amigos-prototipo .am-exit strong {font-weight:600}
#amigos-prototipo .am-guest + .am-guest {border-top:1px solid #cfd3c5;margin-top:22px;padding-top:22px}
#amigos-prototipo .am-empty {font-size:18px;text-align:center;line-height:1.6;padding:44px 20px;margin:0}
#amigos-prototipo dialog {color:#123B2A;background:#F5F0E6;border:1px solid #b5beae;border-radius:16px;padding:25px;width:calc(100% - 36px);max-width:380px;font-family:inherit}
#amigos-prototipo dialog::backdrop {background:#123b2a66}
#amigos-prototipo dialog h2 {font-size:22px;letter-spacing:0}
#amigos-prototipo dialog label {display:block;font-size:14px;margin-bottom:8px}
#amigos-prototipo dialog input {width:100%;min-height:54px;font-size:18px;border:1px solid #7A7A4A;border-radius:8px;background:#fffdf8;color:#123B2A;padding:12px}
#amigos-prototipo .am-actions {display:flex;gap:10px;margin-top:20px}
#amigos-prototipo .am-actions button {min-height:50px;flex:1;border:1px solid #123B2A;border-radius:8px;background:transparent;color:#123B2A;font-size:15px;font-weight:600}
#amigos-prototipo .am-actions .am-apply {background:#123B2A;color:#F5F0E6}
@media(max-width:359px){#amigos-prototipo{padding:24px 12px}#amigos-prototipo .am-card{padding:20px}#amigos-prototipo .am-nav button{font-size:12px}#amigos-prototipo .am-nav .am-selected{font-size:14px}}
</style>
<div id="amigos-prototipo">
<header>
<img class="am-logo" src="logo-oficial.png" alt="Los Amigos Ecoturismo y Reserva Natural, logotipo oficial">
<nav class="am-nav" aria-label="Consultar por fecha">
<button type="button" data-am="previous" aria-label="Día anterior"></button>
<button type="button" data-am="today" class="am-selected" aria-label="Volver a hoy"></button>
<button type="button" data-am="next" aria-label="Día siguiente"></button>
</nav>
<button type="button" class="am-choose" data-am="choose">Elegir otra fecha</button>
<p class="am-demo">DATOS DE DEMOSTRACIÓN<br>Hoy en la demostración: 1 sep 2026</p>
</header>
<main data-am="results" aria-live="polite" aria-atomic="true"></main>
<dialog data-am="dialog" aria-labelledby="am-date-title">
<form data-am="form">
<h2 id="am-date-title">Elegir otra fecha</h2>
<label for="am-date-input">Fecha de consulta</label>
<input id="am-date-input" data-am="input" type="date" required min="1900-01-01" max="2100-12-31">
<div class="am-actions"><button data-am="cancel" type="button">Cancelar</button><button class="am-apply" type="submit">Ver fecha</button></div>
</form>
</dialog>
</div>
<script>
(() => {
const root = document.getElementById('amigos-prototipo');
const el = name => root.querySelector('[data-am="'+name+'"]');
const today = '2026-09-01';
let selected = today;
// Fictitious confirmed stays only. No connector, storage or reservation writes.
const stays = [
 {cabin:'BUGAMBILIA',name:'Juan Pérez',people:4,arrival:'2026-09-01',departure:'2026-09-03'},
 {cabin:'MARIPOSA',name:'Ana Torres',people:2,arrival:'2026-08-30',departure:'2026-09-02'},
 {cabin:'CARACOLES',name:'Pedro Ruiz',people:2,arrival:'2026-08-30',departure:'2026-09-01'},
 {cabin:'CARACOLES',name:'Laura Gómez',people:4,arrival:'2026-09-01',departure:'2026-09-03'},
 {cabin:'ARMADILLO',name:'Elena Castro',people:3,arrival:'2026-08-29',departure:'2026-09-01'}
];
const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dateParts(d){return d.split('-').map(Number)}
function shortDate(d){const [y,m,day]=dateParts(d);return day+' '+months[m-1]}
function shift(d,n){const [y,m,day]=dateParts(d);const next=new Date(Date.UTC(y,m-1,day+n));return next.toISOString().slice(0,10)}
function visible(d){return stays.filter(s=>s.arrival<=d&&s.departure>=d)}
function situation(s,d){return s.departure===d?'departure':s.arrival===d?'arrival':'stay'}
const labels={arrival:'LLEGA HOY',stay:'HOSPEDADO',departure:'SALE HOY'};
const symbols={arrival:'↘',stay:'●',departure:'↗'};
function guest(s){const state=situation(s,selected);return '<section class="am-guest"><p class="am-people">'+s.people+' PERSONAS</p><p class="am-name">'+s.name+'</p><p class="am-status am-'+state+'"><span aria-hidden="true">'+symbols[state]+'</span>'+labels[state]+'</p><p class="am-exit">Sale: <strong>'+shortDate(s.departure)+'</strong></p></section>'}
function render(){
 el('previous').textContent='‹ '+shortDate(shift(selected,-1)).toUpperCase();
 el('next').textContent=shortDate(shift(selected,1)).toUpperCase()+' ›';
 el('today').innerHTML=(selected===today?'HOY · ':'')+shortDate(selected).toUpperCase()+(selected===today?'':'<small>Volver a hoy</small>');
 el('today').setAttribute('aria-label','Fecha seleccionada: '+shortDate(selected)+' '+selected.slice(0,4)+'. Volver a hoy');
 const groups=new Map();
 visible(selected).forEach(s=>{if(!groups.has(s.cabin))groups.set(s.cabin,[]);groups.get(s.cabin).push(s)});
 el('results').innerHTML=groups.size?Array.from(groups,([cabin,guests])=>'<article class="am-card"><h2>'+cabin+'</h2>'+guests.sort((a,b)=>a.arrival.localeCompare(b.arrival)).map(guest).join('')+'</article>').join(''):'<p class="am-empty">No hay huéspedes para esta fecha.</p>';
}
el('previous').addEventListener('click',()=>{selected=shift(selected,-1);render()});
el('next').addEventListener('click',()=>{selected=shift(selected,1);render()});
el('today').addEventListener('click',()=>{selected=today;render()});
el('choose').addEventListener('click',()=>{el('input').value=selected;el('dialog').showModal()});
el('cancel').addEventListener('click',()=>el('dialog').close());
el('form').addEventListener('submit',e=>{e.preventDefault();if(el('input').value&&el('form').reportValidity()){selected=el('input').value;render();el('dialog').close()}});
render();
})();
</script>
</body></html>
